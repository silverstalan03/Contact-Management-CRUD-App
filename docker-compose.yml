version: '3.8'

services:
  # Backend Service
  backend:
    build: ./backend
    ports:
      - "5002:5002"  # Map the backend service to localhost:5002
    environment:
      - NODE_ENV=production

  # Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "3000:80"  # Map the frontend service to localhost:3000
    depends_on:
      - backend  # Wait for the backend service to start
